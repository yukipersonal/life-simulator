<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Life Simulator</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --card2:#1f2937; --text:#e5e7eb;
      --muted:#94a3b8; --line:#334155; --accent:#38bdf8; --good:#22c55e;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0f172a,#020617);color:var(--text)}
    header{padding:22px 16px 10px}
    h1{font-size:24px;margin:0 0 6px}
    .sub{color:var(--muted);font-size:13px}
    .wrap{padding:10px 14px 30px;max-width:980px;margin:auto}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){.grid{grid-template-columns:360px 1fr}}
    .card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .control{margin:14px 0}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    label{font-size:14px;color:#cbd5e1}
    .val{font-weight:700;color:white}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
    .kpi .name{color:var(--muted);font-size:12px}
    .kpi .num{font-size:20px;font-weight:800;margin-top:4px}
    canvas{width:100%;height:260px;background:#020617;border-radius:14px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
    th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right}
    th:first-child,td:first-child{text-align:left}
    th{color:#cbd5e1}
    .note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
  </style>
</head>
<body>
  <header>
    <h1>Life Simulator</h1>
    <div class="sub">年収上昇 × 投資率 × 複利で、将来資産を円ベースで見る</div>
  </header>

  <main class="wrap grid">
    <section class="card">
      <div class="control">
        <div class="row"><label>初期資産</label><span class="val" id="vInitial"></span></div>
        <input id="initial" type="range" min="0" max="50000000" step="100000" value="1000000">
      </div>
      <div class="control">
        <div class="row"><label>初年度年収</label><span class="val" id="vSalary"></span></div>
        <input id="salary" type="range" min="3000000" max="30000000" step="100000" value="5300000">
      </div>
      <div class="control">
        <div class="row"><label>年収成長率</label><span class="val" id="vSalaryGrowth"></span></div>
        <input id="salaryGrowth" type="range" min="0" max="20" step="0.1" value="7">
      </div>
      <div class="control">
        <div class="row"><label>投資率（年収に対して）</label><span class="val" id="vInvestRate"></span></div>
        <input id="investRate" type="range" min="0" max="70" step="1" value="25">
      </div>
      <div class="control">
        <div class="row"><label>運用利回り</label><span class="val" id="vReturnRate"></span></div>
        <input id="returnRate" type="range" min="0" max="15" step="0.1" value="5">
      </div>
      <div class="control">
        <div class="row"><label>期間</label><span class="val" id="vYears"></span></div>
        <input id="years" type="range" min="1" max="50" step="1" value="30">
      </div>
      <div class="note">※税金・インフレ・暴落は未反映。まずは「年収が伸びるほど投資額も増える」基本モデル。</div>
    </section>

    <section class="card">
      <div class="kpis">
        <div class="kpi"><div class="name">最終資産</div><div class="num" id="finalAsset"></div></div>
        <div class="kpi"><div class="name">最終年収</div><div class="num" id="finalSalary"></div></div>
        <div class="kpi"><div class="name">累計投資額</div><div class="num" id="totalInvested"></div></div>
        <div class="kpi"><div class="name">運用益</div><div class="num" id="gain"></div></div>
      </div>
      <canvas id="chart" width="900" height="420"></canvas>
      <table>
        <thead><tr><th>年</th><th>年収</th><th>年間投資</th><th>資産</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

<script>
  const ids = ["initial","salary","salaryGrowth","investRate","returnRate","years"];
  const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const yen = n => Math.round(n).toLocaleString("ja-JP") + "円";
  const man = n => (n/10000).toLocaleString("ja-JP",{maximumFractionDigits:0}) + "万円";
  const pct = n => Number(n).toFixed(1).replace(".0","") + "%";

  function calc(){
    const initial = +el.initial.value;
    const salary0 = +el.salary.value;
    const sg = +el.salaryGrowth.value / 100;
    const ir = +el.investRate.value / 100;
    const rr = +el.returnRate.value / 100;
    const years = +el.years.value;

    document.getElementById("vInitial").textContent = man(initial);
    document.getElementById("vSalary").textContent = man(salary0);
    document.getElementById("vSalaryGrowth").textContent = pct(el.salaryGrowth.value);
    document.getElementById("vInvestRate").textContent = pct(el.investRate.value);
    document.getElementById("vReturnRate").textContent = pct(el.returnRate.value);
    document.getElementById("vYears").textContent = years + "年";

    let asset = initial, totalInvest = 0;
    const rows = [];
    for(let y=1; y<=years; y++){
      const salary = salary0 * Math.pow(1+sg, y-1);
      const invest = salary * ir;
      asset = asset * (1+rr) + invest;
      totalInvest += invest;
      rows.push({year:y, salary, invest, asset});
    }

    const last = rows[rows.length-1];
    document.getElementById("finalAsset").textContent = man(last.asset);
    document.getElementById("finalSalary").textContent = man(last.salary);
    document.getElementById("totalInvested").textContent = man(totalInvest);
    document.getElementById("gain").textContent = man(last.asset - initial - totalInvest);

    draw(rows);
    fillTable(rows);
  }

  function draw(rows){
    const c = document.getElementById("chart"), ctx = c.getContext("2d");
    const W=c.width,H=c.height,p=48;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#020617"; ctx.fillRect(0,0,W,H);
    const max = Math.max(...rows.map(r=>r.asset), ...rows.map(r=>r.salary));
    const x = i => p + i*(W-p*1.4)/(rows.length-1 || 1);
    const y = v => H-p - (v/max)*(H-p*1.7);

    ctx.strokeStyle="#334155"; ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const yy=p+i*(H-p*1.7)/4;
      ctx.beginPath(); ctx.moveTo(p,yy); ctx.lineTo(W-p/2,yy); ctx.stroke();
    }

    function line(key, color){
      ctx.strokeStyle=color; ctx.lineWidth=4; ctx.beginPath();
      rows.forEach((r,i)=>{ const xx=x(i), yy=y(r[key]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
      ctx.stroke();
    }
    line("asset","#38bdf8");
    line("salary","#22c55e");

    ctx.fillStyle="#e5e7eb"; ctx.font="24px -apple-system";
    ctx.fillText("資産", p, 28); ctx.fillStyle="#38bdf8"; ctx.fillRect(p+54,12,26,8);
    ctx.fillStyle="#e5e7eb"; ctx.fillText("年収", p+100, 28); ctx.fillStyle="#22c55e"; ctx.fillRect(p+154,12,26,8);
  }

  function fillTable(rows){
    const tbody = document.getElementById("tbody");
    const sampled = rows.filter((_,i)=> i===0 || (i+1)%5===0 || i===rows.length-1);
    tbody.innerHTML = sampled.map(r => `<tr><td>${r.year}年目</td><td>${man(r.salary)}</td><td>${man(r.invest)}</td><td>${man(r.asset)}</td></tr>`).join("");
  }

  ids.forEach(id => el[id].addEventListener("input", calc));
  calc();
</script>
</body>
</html>
